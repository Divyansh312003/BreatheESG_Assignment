services:
  - type: web
    name: breathe-esg-assignment
    runtime: python
    plan: free
    branch: feature/breathe-esg-prototype
    buildCommand: bash ./scripts/render_build.sh
    preDeployCommand: bash ./scripts/render_release.sh
    startCommand: gunicorn --chdir backend --bind 0.0.0.0:$PORT --workers 2 --access-logfile - --error-logfile - config.wsgi:application
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PYTHONPATH
        value: backend
